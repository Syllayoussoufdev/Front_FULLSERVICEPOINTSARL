services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: fsp_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - fsp_network

  nginx:
    image: nginx:alpine
    container_name: fsp_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - fsp_network

  db:
    image: mysql:8.0
    container_name: fsp_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-fsp_db}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root_secret}
      MYSQL_USER: ${DB_USERNAME:-fsp_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-fsp_secret}
    ports:
      - "3306:3306"
    volumes:
      - fsp_db_data:/var/lib/mysql
    networks:
      - fsp_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: fsp_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "8081:80"
    depends_on:
      - db
    networks:
      - fsp_network

  node:
    image: node:20-alpine
    container_name: fsp_node
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    networks:
      - fsp_network

networks:
  fsp_network:
    driver: bridge

volumes:
  fsp_db_data:
    driver: local
